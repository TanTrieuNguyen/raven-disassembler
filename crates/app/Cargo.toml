[package]
name = "raven"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gui = ["dep:eframe", "dep:image"]

[dependencies]
raven-core = { path = "../core" }
raven-store = { path = "../addons" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
reqwest = {version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"]}
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
eframe = {version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"]}
tempfile = "3.27.0"

[[bin]]
name = "raven"
path = "src/bin/raven.rs"

[[bin]]
name = "raven-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "raven-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
