[package]
name = "raven-core"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = { version = "0.36", features = ["read", "write"] }
capstone = "0.12"
sha2 = "0.10"
hex = "0.4"
gimli = { version = "0.32.3", default-features = false, features = ["read", "std"] }
flate2 = "1"
